[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmia"
version = "0.1.0"
description = "Session-level defense against membership inference attacks on RAG systems (CS 528)"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "sentence-transformers",
    "transformers",
    "numpy",
    "pandas",
    "requests",
    "tqdm",
    "scikit-learn",
    "matplotlib",
]

[tool.setuptools]
packages = ["ragmia"]