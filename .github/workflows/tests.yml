name: tests

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (defenses need only numpy)
        run: pip install numpy pytest
      - name: Run unit tests
        run: pytest -v
        env:
          PYTHONPATH: .